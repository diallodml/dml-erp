<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — ERP DML SARL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/dml.css?v=4">
</head>
<body class="connexion">

<div class="carte-connexion">
  <div class="marque">DML SARL</div>
  <div class="sous-marque">Collecte &middot; Stock &middot; Douala</div>

  <div class="champ">
    <label for="login">Identifiant</label>
    <input id="login" type="text" autocomplete="username" autocapitalize="none" autofocus>
  </div>

  <div class="champ">
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password">
  </div>

  <div id="msg" class="message erreur" hidden></div>

  <button id="btn" class="bouton">Se connecter</button>

  <p class="pied">Poste interne — ne pas partager vos identifiants</p>
</div>

<script src="/static/dml.js?v=4"></script>
<script>
const btn = document.getElementById("btn");

if (localStorage.getItem("dml_expire")) {
  localStorage.removeItem("dml_expire");
  DML.message("msg", "Vous avez été déconnecté après 30 minutes sans activité.", "erreur");
}

async function connecter() {
  const login = document.getElementById("login").value.trim();
  const mdp = document.getElementById("mdp").value;
  DML.cacherMessage("msg");

  if (!login || !mdp) {
    DML.message("msg", "Saisissez votre identifiant et votre mot de passe.", "erreur");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Connexion…";

  try {
    const corps = new URLSearchParams({ username: login, password: mdp });
    const r = await fetch("/api/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: corps,
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Connexion refusee");

    localStorage.setItem("dml_jeton", data.access_token);

    const profil = await DML.api("/api/v1/auth/moi");
    localStorage.setItem("dml_profil", JSON.stringify(profil));

    location.href = data.doit_changer_mdp ? "/mot-de-passe" : "/saisie";
  } catch (e) {
    DML.message("msg", e.message, "erreur");
    btn.disabled = false;
    btn.textContent = "Se connecter";
  }
}

btn.addEventListener("click", connecter);
document.addEventListener("keydown", (e) => { if (e.key === "Enter") connecter(); });
</script>
</body>
</html>
